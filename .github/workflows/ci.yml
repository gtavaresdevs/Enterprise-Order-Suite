# Runs the full backend test suite on the working branch (ADR-0015 readiness gate).
# Testcontainers uses the runner's Docker. org.gradle.java.home is overridden because the
# committed gradle.properties points at a Windows JDK path.
name: CI

on:
  push:
    branches: [feature/ai-agent]
  pull_request:
    branches: [feature/ai-agent]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test "-Dorg.gradle.java.home=$JAVA_HOME"
