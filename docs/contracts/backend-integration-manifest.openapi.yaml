    date: 2026-09-19
    changes:
      - 'Base path corrected to /api (was /api/v1); servers reduced to one, the second server duplicated the /public prefix already in the paths.'
      - 'Added Auth target change: JWT identity claims (firstName, lastName, email), refresh token in HttpOnly cookie, /auth/refresh and /auth/logout read the cookie, CORS with credentials, Origin check as the CSRF defense.'
      - 'Menu: AddonOption.maxQuantity; managed category CRUD (/menu-categories) with rename cascade and 409 categoryInUse; Error.code added.'
      - 'Orders: paymentMethod, cardType, changeFor, deliveryZone, etaMinutes added; total includes the delivery fee; createdAt format note tied to Home earnings; paymentStatus sequencing note.'
      - 'Proposed: /delivery-zones, /restaurant-settings, /public/restaurant-settings (storefront branding, WhatsApp number, active zones).'
      - 'Public orders: storefront checkout and /track-order are built in the frontend (descriptions updated, contract unchanged).'
      - 'Documented the live baseline (legacy /orders and /products shape) and the Home earnings semantics; added x-open-decisions and x-maintenance.'
    why: 'Bring the manifest in line with the frontend as of 2026-09-19 and the auth decisions taken in this session, so the backend can implement against one accurate file.'
    breaking: 'Auth response drops refreshToken from the body (coordinated switch with the frontend); paths lose the /v1 segment.'
  - version: "0.1.0"
    date: 2026-09-14
    changes:
      - 'Initial manifest generated from the frontend mock services and types (Menu, Tables, Orders, public storefront).'
