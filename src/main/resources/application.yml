server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:86400000}

app:
  urls:
    password-reset: ${APP_PASSWORD_RESET_URL}

# ENTERPRISE RATE LIMIT METADATA
# This structure sets sensible defaults while exposing explicit hooks for DevOps overrides
security:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    forgot-password:
      capacity: ${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:5}
      refill-seconds: ${RATE_LIMIT_FORGOT_PASSWORD_REFILL:10}
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      refill-seconds: ${RATE_LIMIT_LOGIN_REFILL:5}
    refresh:
      capacity: ${RATE_LIMIT_REFRESH_CAPACITY:10}
      refill-seconds: ${RATE_LIMIT_REFRESH_REFILL:1}
    logout:
      capacity: ${RATE_LIMIT_LOGOUT_CAPACITY:30}
      refill-seconds: ${RATE_LIMIT_LOGOUT_REFILL:1}
    reset-password:
      capacity: ${RATE_LIMIT_RESET_PASSWORD_CAPACITY:5}
      refill-seconds: ${RATE_LIMIT_RESET_PASSWORD_REFILL:10}

logging:
  level:
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: enterprise-order-suite
    description: Production-grade backend system
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
